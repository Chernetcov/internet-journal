<a href="/articles?active_category={{ category.slug }}"
   class="group focus-ring overflow-hidden border border-line bg-white/40 transition hover:-translate-y-1 hover:shadow-subtle">
    <div class="image-zoom overflow-hidden">
        {% if category.image %}
            <img src="{{ category.image.image.url }}"
                 {% if category.image.srcset %}srcset="{{ category.image.srcset }}"
                 sizes="(min-width: 1024px) 33vw, (min-width: 640px) 50vw, 100vw"{% endif %}
                 alt="{{ category.name }}"
                 class="aspect-[4/3] w-full object-cover"
                 loading="lazy">
        {% else %}
            <div class="aspect-[4/3] w-full bg-line" aria-hidden="true"></div>
        {% endif %}
    </div>
    <div class="border-b-4 p-3 sm:p-4 {% if color == 'blue' %}border-blue{% elif color == 'terracotta' %}border-terracotta{% elif color == 'petrol' %}border-petrol{% else %}border-ochre{% endif %}">
        <h3 class="font-display text-xl sm:text-2xl">{{ category.name }}</h3>
        <p class="mt-2 text-xs leading-relaxed text-graphite sm:text-sm">{{ category.description }}</p>
        <span class="mt-3 inline-block text-sm {% if color == 'blue' %}text-blue{% elif color == 'terracotta' %}text-terracotta{% elif color == 'petrol' %}text-petrol{% else %}text-ochre{% endif %}" aria-hidden="true">Изучить →</span>
    </div>
</a>
