<article>
  <a href="{% url 'article' article.slug %}" class="image-zoom focus-ring block overflow-hidden bg-linen">
    <img src="{{ article.image.url }}" alt="{{ article.title }}" class="aspect-[3/2] w-full object-cover" loading="lazy">
  </a>
  <p class="mb-2 mt-3 text-[10px] uppercase tracking-[.15em] text-terracotta">{{ article.category.name }}</p>
  <h3 class="font-display text-xl leading-snug"><a class="focus-ring hover:text-terracotta" href="{% url 'article' article.slug %}">{{ article.title }}</a></h3>
  {% load dates %}
  <p class="mt-3 text-xs text-graphite">{{ article.publicated | rus_date }}<span class="mx-1">·</span> {{ article.time_to_read }} мин</p>
</article>
